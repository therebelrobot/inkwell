version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
